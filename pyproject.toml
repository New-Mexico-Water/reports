[project]
name = "nmreports"
version = "0.1.0"
description = "Researched reports on New Mexico water: feature histories checked against the nmwater archive"
requires-python = ">=3.13"
dependencies = ["nmwater", "duckdb", "pandas", "numpy"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
nmwater = { path = "../../water_newmexico", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nmreports"]

[tool.ruff]
line-length = 150
target-version = "py313"
